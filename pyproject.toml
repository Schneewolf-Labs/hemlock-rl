[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hemlock-rl"
version = "0.1.0"
description = "Train LLMs to write Hemlock via execution rewards (GRPO through jing)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# NOTE: torch is intentionally excluded — it's version/CUDA-specific and
# users must install it themselves (same policy as grimoire/jing).
dependencies = [
    "jing @ git+https://github.com/Schneewolf-Labs/jing.git@main",
    "datasets>=2.14.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0"]

[project.urls]
Homepage = "https://github.com/Schneewolf-Labs/hemlock-rl"

[tool.setuptools]
packages = ["hemlock_rl"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
